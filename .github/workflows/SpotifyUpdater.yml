            -H "Authorization: Bearer ${SPOTIFY_ACCESS_TOKEN_RUNTIME}")

          if [[ "$http_code" != "200" ]]; then
            echo "Failed to get medium-term top tracks."
            echo "HTTP status: $http_code"

            cat topTracksMedium.json

            exit 1
          fi

          if ! jq -e '.items and (.items | type == "array")' topTracksMedium.json > /dev/null; then
            echo "Spotify returned an unexpected response:"
            cat topTracksMedium.json
            exit 1
          fi

          mediumTrack_1=$(jq -r '.items[0].name // empty' topTracksMedium.json)
          mediumArtist_1=$(jq -r '.items[0].album.artists[0].name // empty' topTracksMedium.json)
          mediumImg_1=$(jq -r '.items[0].album.images[2].url // .items[0].album.images[0].url // empty' topTracksMedium.json)

          mediumTrack_2=$(jq -r '.items[1].name // empty' topTracksMedium.json)
          mediumArtist_2=$(jq -r '.items[1].album.artists[0].name // empty' topTracksMedium.json)
          mediumImg_2=$(jq -r '.items[1].album.images[2].url // .items[1].album.images[0].url // empty' topTracksMedium.json)

          mediumTrack_3=$(jq -r '.items[2].name // empty' topTracksMedium.json)
          mediumArtist_3=$(jq -r '.items[2].album.artists[0].name // empty' topTracksMedium.json)
          mediumImg_3=$(jq -r '.items[2].album.images[2].url // .items[2].album.images[0].url // empty' topTracksMedium.json)

          mediumTrack_4=$(jq -r '.items[3].name // empty' topTracksMedium.json)
          mediumArtist_4=$(jq -r '.items[3].album.artists[0].name // empty' topTracksMedium.json)
          mediumImg_4=$(jq -r '.items[3].album.images[2].url // .items[3].album.images[0].url // empty' topTracksMedium.json)

          mediumTrack_5=$(jq -r '.items[4].name // empty' topTracksMedium.json)
          mediumArtist_5=$(jq -r '.items[4].album.artists[0].name // empty' topTracksMedium.json)
          mediumImg_5=$(jq -r '.items[4].album.images[2].url // .items[4].album.images[0].url // empty' topTracksMedium.json)

          {
            echo "mediumTrack_1<<EOF"
            echo "$mediumTrack_1"
            echo "EOF"

            echo "mediumArtist_1<<EOF"
            echo "$mediumArtist_1"
            echo "EOF"

            echo "mediumImg_1=$mediumImg_1"

            echo "mediumTrack_2<<EOF"
            echo "$mediumTrack_2"
            echo "EOF"

            echo "mediumArtist_2<<EOF"
            echo "$mediumArtist_2"
            echo "EOF"

            echo "mediumImg_2=$mediumImg_2"

            echo "mediumTrack_3<<EOF"
            echo "$mediumTrack_3"
            echo "EOF"

            echo "mediumArtist_3<<EOF"
            echo "$mediumArtist_3"
            echo "EOF"

            echo "mediumImg_3=$mediumImg_3"

            echo "mediumTrack_4<<EOF"
            echo "$mediumTrack_4"
            echo "EOF"

            echo "mediumArtist_4<<EOF"
            echo "$mediumArtist_4"
            echo "EOF"

            echo "mediumImg_4=$mediumImg_4"

            echo "mediumTrack_5<<EOF"
            echo "$mediumTrack_5"
            echo "EOF"

            echo "mediumArtist_5<<EOF"
            echo "$mediumArtist_5"
            echo "EOF"

            echo "mediumImg_5=$mediumImg_5"
          } >> "$GITHUB_ENV"

          echo "Medium-term tracks retrieved successfully."


      # ------------------------------------------------------------
      # Get Top Tracks - Long Term
      # ------------------------------------------------------------
      - name: Get Users Top Tracks (Long)
        id: top_tracks_long
        shell: bash
        run: |
          set -euo pipefail

          echo "Getting long-term top tracks..."

          http_code=$(curl -sS \
            -o topTracksLong.json \
            -w "%{http_code}" \
            -X GET "https://api.spotify.com/v1/me/top/tracks?limit=5&time_range=long_term" \
            -H "Authorization: Bearer ${SPOTIFY_ACCESS_TOKEN_RUNTIME}")

          if [[ "$http_code" != "200" ]]; then
            echo "Failed to get long-term top tracks."
            echo "HTTP status: $http_code"

            cat topTracksLong.json

            exit 1
          fi

          if ! jq -e '.items and (.items | type == "array")' topTracksLong.json > /dev/null; then
            echo "Spotify returned an unexpected response:"
            cat topTracksLong.json
            exit 1
          fi

          longTrack_1=$(jq -r '.items[0].name // empty' topTracksLong.json)
          longArtist_1=$(jq -r '.items[0].album.artists[0].name // empty' topTracksLong.json)
          longImg_1=$(jq -r '.items[0].album.images[2].url // .items[0].album.images[0].url // empty' topTracksLong.json)

          longTrack_2=$(jq -r '.items[1].name // empty' topTracksLong.json)
          longArtist_2=$(jq -r '.items[1].album.artists[0].name // empty' topTracksLong.json)
          longImg_2=$(jq -r '.items[1].album.images[2].url // .items[1].album.images[0].url // empty' topTracksLong.json)

          longTrack_3=$(jq -r '.items[2].name // empty' topTracksLong.json)
          longArtist_3=$(jq -r '.items[2].album.artists[0].name // empty' topTracksLong.json)
          longImg_3=$(jq -r '.items[2].album.images[2].url // .items[2].album.images[0].url // empty' topTracksLong.json)

          longTrack_4=$(jq -r '.items[3].name // empty' topTracksLong.json)
          longArtist_4=$(jq -r '.items[3].album.artists[0].name // empty' topTracksLong.json)
          longImg_4=$(jq -r '.items[3].album.images[2].url // .items[3].album.images[0].url // empty' topTracksLong.json)

          longTrack_5=$(jq -r '.items[4].name // empty' topTracksLong.json)
          longArtist_5=$(jq -r '.items[4].album.artists[0].name // empty' topTracksLong.json)
          longImg_5=$(jq -r '.items[4].album.images[2].url // .items[4].album.images[0].url // empty' topTracksLong.json)

          {
            echo "longTrack_1<<EOF"
            echo "$longTrack_1"
            echo "EOF"

            echo "longArtist_1<<EOF"
            echo "$longArtist_1"
            echo "EOF"

            echo "longImg_1=$longImg_1"

            echo "longTrack_2<<EOF"
            echo "$longTrack_2"
            echo "EOF"

            echo "longArtist_2<<EOF"
            echo "$longArtist_2"
            echo "EOF"

            echo "longImg_2=$longImg_2"

            echo "longTrack_3<<EOF"
            echo "$longTrack_3"
            echo "EOF"

            echo "longArtist_3<<EOF"
            echo "$longArtist_3"
            echo "EOF"

            echo "longImg_3=$longImg_3"

            echo "longTrack_4<<EOF"
            echo "$longTrack_4"
            echo "EOF"

            echo "longArtist_4<<EOF"
            echo "$longArtist_4"
            echo "EOF"

            echo "longImg_4=$longImg_4"

            echo "longTrack_5<<EOF"
            echo "$longTrack_5"
            echo "EOF"

            echo "longArtist_5<<EOF"
            echo "$longArtist_5"
            echo "EOF"

            echo "longImg_5=$longImg_5"
          } >> "$GITHUB_ENV"

          echo "Long-term tracks retrieved successfully."


      # ------------------------------------------------------------
      # Update Markdown File - Short
      # ------------------------------------------------------------
      - name: Update Markdown File (Short)
        shell: bash
        run: |
          set -euo pipefail

          ID_LIST="shortImg_1~${shortImg_1}~shortTitle_1~\"${shortTrack_1}\"~shortArtist_1~\"${shortArtist_1}\"~
          shortImg_2~${shortImg_2}~shortTitle_2~\"${shortTrack_2}\"~shortArtist_2~\"${shortArtist_2}\"~
          shortImg_3~${shortImg_3}~shortTitle_3~\"${shortTrack_3}\"~shortArtist_3~\"${shortArtist_3}\"~
          shortImg_4~${shortImg_4}~shortTitle_4~\"${shortTrack_4}\"~shortArtist_4~\"${shortArtist_4}\"~
          shortImg_5~${shortImg_5}~shortTitle_5~\"${shortTrack_5}\"~shortArtist_5~\"${shortArtist_5}\"~"

          echo "$ID_LIST" | while IFS= read -r ITEM; do
            IMG_ID=$(echo "$ITEM" | cut -d '~' -f1)
            NEW_IMG=$(echo "$ITEM" | cut -d '~' -f2)
            TITLE_ID=$(echo "$ITEM" | cut -d '~' -f3)
            NEW_TRACK=$(echo "$ITEM" | cut -d '~' -f4 | sed "s/'//g" | sed 's/"//g' | sed 's/&/\\\&/g')
            ARTIST_ID=$(echo "$ITEM" | cut -d '~' -f5)
            NEW_ARTIST=$(echo "$ITEM" | cut -d '~' -f6 | sed "s/'//g" | sed 's/"//g' | sed 's/&/\\\&/g')

            echo "$NEW_TRACK"
            echo "$NEW_ARTIST"

            sed -i "s|<img\s*id=\"$IMG_ID\"\s*src=\"[^\"]*\"|<img id=\"$IMG_ID\" src=\"$NEW_IMG\"|g" README.md
            sed -i "s|<b\s*id=\"$TITLE_ID\">\s*.*</b>|<b id=\"$TITLE_ID\">$NEW_TRACK</b>|g" README.md
            sed -i "s|<i\s*id=\"$ARTIST_ID\">\s*.*</i>|<i id=\"$ARTIST_ID\">$NEW_ARTIST</i>|g" README.md
          done


      # ------------------------------------------------------------
      # Update Markdown File - Medium
      # ------------------------------------------------------------
      - name: Update Markdown File (Medium)
        shell: bash
        run: |
          set -euo pipefail

          ID_LIST="mediumImg_1~${mediumImg_1}~mediumTitle_1~\"${mediumTrack_1}\"~mediumArtist_1~\"${mediumArtist_1}\"~
          mediumImg_2~${mediumImg_2}~mediumTitle_2~\"${mediumTrack_2}\"~mediumArtist_2~\"${mediumArtist_2}\"~
          mediumImg_3~${mediumImg_3}~mediumTitle_3~\"${mediumTrack_3}\"~mediumArtist_3~\"${mediumArtist_3}\"~
          mediumImg_4~${mediumImg_4}~mediumTitle_4~\"${mediumTrack_4}\"~mediumArtist_4~\"${mediumArtist_4}\"~
          mediumImg_5~${mediumImg_5}~mediumTitle_5~\"${mediumTrack_5}\"~mediumArtist_5~\"${mediumArtist_5}\"~"

          echo "$ID_LIST" | while IFS= read -r ITEM; do
            IMG_ID=$(echo "$ITEM" | cut -d '~' -f1)
            NEW_IMG=$(echo "$ITEM" | cut -d '~' -f2)
            TITLE_ID=$(echo "$ITEM" | cut -d '~' -f3)
            NEW_TRACK=$(echo "$ITEM" | cut -d '~' -f4 | sed "s/'//g" | sed 's/"//g' | sed 's/&/\\\&/g')
            ARTIST_ID=$(echo "$ITEM" | cut -d '~' -f5)
            NEW_ARTIST=$(echo "$ITEM" | cut -d '~' -f6 | sed "s/'//g" | sed 's/"//g' | sed 's/&/\\\&/g')

            echo "$NEW_TRACK"
            echo "$NEW_ARTIST"

            sed -i "s|<img\s*id=\"$IMG_ID\"\s*src=\"[^\"]*\"|<img id=\"$IMG_ID\" src=\"$NEW_IMG\"|g" README.md
            sed -i "s|<b\s*id=\"$TITLE_ID\">\s*.*</b>|<b id=\"$TITLE_ID\">$NEW_TRACK</b>|g" README.md
            sed -i "s|<i\s*id=\"$ARTIST_ID\"\s*>\s*.*</i>|<i id=\"$ARTIST_ID\">$NEW_ARTIST</i>|g" README.md
          done


      # ------------------------------------------------------------
      # Update Markdown File - Long
      # ------------------------------------------------------------
      - name: Update Markdown File (Long)
        shell: bash
        run: |
          set -euo pipefail

          ID_LIST="longImg_1~${longImg_1}~longTitle_1~\"${longTrack_1}\"~longArtist_1~\"${longArtist_1}\"~
          longImg_2~${longImg_2}~longTitle_2~\"${longTrack_2}\"~longArtist_2~\"${longArtist_2}\"~
          longImg_3~${longImg_3}~longTitle_3~\"${longTrack_3}\"~longArtist_3~\"${longArtist_3}\"~
          longImg_4~${longImg_4}~longTitle_4~\"${longTrack_4}\"~longArtist_4~\"${longArtist_4}\"~
          longImg_5~${longImg_5}~longTitle_5~\"${longTrack_5}\"~longArtist_5~\"${longArtist_5}\"~"

          echo "$ID_LIST" | while IFS= read -r ITEM; do
            IMG_ID=$(echo "$ITEM" | cut -d '~' -f1)
            NEW_IMG=$(echo "$ITEM" | cut -d '~' -f2)
            TITLE_ID=$(echo "$ITEM" | cut -d '~' -f3)
            NEW_TRACK=$(echo "$ITEM" | cut -d '~' -f4 | sed "s/'//g" | sed 's/"//g' | sed 's/&/\\\&/g')
            ARTIST_ID=$(echo "$ITEM" | cut -d '~' -f5)
            NEW_ARTIST=$(echo "$ITEM" | cut -d '~' -f6 | sed "s/'//g" | sed 's/"//g' | sed 's/&/\\\&/g')

            echo "$NEW_TRACK"
            echo "$NEW_ARTIST"

            sed -i "s|<img\s*id=\"$IMG_ID\"\s*src=\"[^\"]*\"|<img id=\"$IMG_ID\" src=\"$NEW_IMG\"|g" README.md
            sed -i "s|<b\s*id=\"$TITLE_ID\">\s*.*</b>|<b id=\"$TITLE_ID\">$NEW_TRACK</b>|g" README.md
            sed -i "s|<i\s*id=\"$ARTIST_ID\"\s*>\s*.*</i>|<i id=\"$ARTIST_ID\">$NEW_ARTIST</i>|g" README.md
          done


      # ------------------------------------------------------------
      # Commit and Push Changes
      # ------------------------------------------------------------
      - name: GIT commit and push all changed files
        env:
          CI_COMMIT_MESSAGE: Update Spotify Section
          CI_COMMIT_AUTHOR: Spotify Updater
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "${CI_COMMIT_AUTHOR}"
          git config --global user.email "noreply@example.com"

          if [[ -n "$(git status --porcelain | grep '^ M\|^ D' || true)" ]]; then
            git add -u .
            git commit -m "${CI_COMMIT_MESSAGE}" --no-verify
            git push
          else
            echo "No changes to commit"
          fi
