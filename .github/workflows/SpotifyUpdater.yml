name: Spotify Updater

# Controls when the workflow will run
on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
  SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
  SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v5

      # ------------------------------------------------------------
      # Generate Spotify Access Token
      # ------------------------------------------------------------
      - name: Generate Refreshed Access Token
        id: spotify_token
        shell: bash
        run: |
          set -euo pipefail

          echo "Refreshing Spotify access token..."

          response=$(curl -sS \
            -X POST "https://accounts.spotify.com/api/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=${SPOTIFY_REFRESH_TOKEN}" \
            --data-urlencode "client_id=${SPOTIFY_CLIENT_ID}" \
            --data-urlencode "client_secret=${SPOTIFY_CLIENT_SECRET}")

          # Do not print the full response because it may contain
          # sensitive information in some API responses.
          error=$(echo "$response" | jq -r '.error // empty')
          error_description=$(echo "$response" | jq -r '.error_description // empty')

          if [[ -n "$error" ]]; then
            echo "Spotify token refresh failed."
            echo "Error: $error"

            if [[ -n "$error_description" ]]; then
              echo "Description: $error_description"
            fi

            if [[ "$error" == "invalid_grant" ]]; then
              echo "Spotify refresh token is invalid or has been revoked."
              echo "Marking the workflow so a GitHub Issue can be created."

              if [[ -z "$error_description" ]]; then
                error_description="No description provided."
              fi

              echo "refresh_failed=true" >> "$GITHUB_OUTPUT"
              echo "refresh_error=${error}" >> "$GITHUB_OUTPUT"

              {
                echo "refresh_error_description<<EOF"
                echo "$error_description"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"

              exit 0
            fi

            echo ""
            echo "Unexpected Spotify token error; failing the workflow."

            exit 1
          fi

          SPOTIFY_ACCESS_TOKEN_RUNTIME=$(echo "$response" | jq -r '.access_token // empty')

          if [[ -z "$SPOTIFY_ACCESS_TOKEN_RUNTIME" ]]; then
            echo "Spotify did not return an access token."
            echo "Unexpected response from Spotify token endpoint."
            exit 1
          fi

          echo "::add-mask::$SPOTIFY_ACCESS_TOKEN_RUNTIME"

          echo "SPOTIFY_ACCESS_TOKEN_RUNTIME=$SPOTIFY_ACCESS_TOKEN_RUNTIME" >> "$GITHUB_ENV"

          echo "Spotify access token refreshed successfully."


      # ------------------------------------------------------------
      # Create GitHub Issue for Revoked Refresh Token
      # ------------------------------------------------------------
      - name: Create Spotify Reauthorization Issue
        if: steps.spotify_token.outputs.refresh_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_ERROR: ${{ steps.spotify_token.outputs.refresh_error }}
          REFRESH_ERROR_DESCRIPTION: ${{ steps.spotify_token.outputs.refresh_error_description }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Spotify refresh token rejected by Spotify."
          echo "Checking for an existing open issue..."

          http_code=$(curl -sS \
            -o issues_response.json \
            -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100")

          if [[ "$http_code" != "200" ]]; then
            echo "Failed to list open GitHub issues."
            echo "HTTP status: $http_code"
            jq -r '.message // .' issues_response.json 2>/dev/null || cat issues_response.json
            exit 1
          fi

          matching_issues=$(jq --arg title "Spotify refresh token revoked" \
            '[.[] | select(.title == $title and .pull_request == null)] | length' issues_response.json)

          if [[ "$matching_issues" -gt 0 ]]; then
            echo "An open issue titled 'Spotify refresh token revoked' already exists."
            echo "No new issue will be created."
            exit 0
          fi

          echo "No existing issue found. Creating a new issue..."

          detected_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          issue_body=$(cat <<EOF
          ## Spotify authorization required

          The Spotify refresh token used by the Spotify Updater workflow is no longer valid.

          ### Spotify response

          - Error: \`${REFRESH_ERROR}\`
          - Description: \`${REFRESH_ERROR_DESCRIPTION}\`

          ### Action required

          Re-authorize the Spotify application and update the repository secret:

          \`SPOTIFY_REFRESH_TOKEN\`

          After updating the secret, manually re-run the Spotify Updater workflow.

          ### Workflow information

          - Workflow: ${GITHUB_WORKFLOW}
          - Run: ${run_url}
          - Detected: ${detected_at}
          EOF
          )

          payload=$(jq -n \
            --arg title "Spotify refresh token revoked" \
            --arg body "$issue_body" \
            '{title: $title, body: $body}')

          create_http_code=$(curl -sS \
            -o issue_response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues")

          if [[ "$create_http_code" != "201" ]]; then
            echo "Failed to create GitHub Issue."
            echo "HTTP status: $create_http_code"
            jq -r '.message // .' issue_response.json 2>/dev/null || cat issue_response.json
            exit 1
          fi

          issue_number=$(jq -r '.number // empty' issue_response.json)
          echo "GitHub Issue created: #${issue_number}"


      # ------------------------------------------------------------
      # Stop workflow when refresh token is revoked
      # ------------------------------------------------------------
      - name: Fail on Revoked Spotify Refresh Token
        if: steps.spotify_token.outputs.refresh_failed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Spotify refresh token is invalid."
          echo "GitHub Issue created/already exists."
          echo "Workflow cannot continue until Spotify is re-authorized."

          exit 1


      # ------------------------------------------------------------
      # Validate Spotify Access Token
      # ------------------------------------------------------------
      - name: Validate Spotify Access Token
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating Spotify access token..."

          http_code=$(curl -sS \
            -o spotify_profile.json \
            -w "%{http_code}" \
            -X GET "https://api.spotify.com/v1/me" \
            -H "Authorization: Bearer ${SPOTIFY_ACCESS_TOKEN_RUNTIME}")

          if [[ "$http_code" != "200" ]]; then
            echo "Spotify access token validation failed."
            echo "HTTP status: $http_code"

            error=$(jq -r '.error.status // empty' spotify_profile.json)
            message=$(jq -r '.error.message // empty' spotify_profile.json)

            if [[ -n "$error" ]]; then
              echo "Spotify error: $error"
            fi

            if [[ -n "$message" ]]; then
              echo "Spotify message: $message"
            fi

            exit 1
          fi

          echo "Spotify access token is valid."


      # ------------------------------------------------------------
      # Get Top Tracks - Short Term
      # ------------------------------------------------------------
      - name: Get Users Top Tracks (Short)
        id: top_tracks
        shell: bash
        run: |
          set -euo pipefail

          echo "Getting short-term top tracks..."

          http_code=$(curl -sS \
            -o topTracksShort.json \
            -w "%{http_code}" \
            -X GET "https://api.spotify.com/v1/me/top/tracks?limit=5&time_range=short_term" \
            -H "Authorization: Bearer ${SPOTIFY_ACCESS_TOKEN_RUNTIME}")

          if [[ "$http_code" != "200" ]]; then
            echo "Failed to get short-term top tracks."
            echo "HTTP status: $http_code"

            cat topTracksShort.json

            exit 1
          fi

          # Make sure Spotify actually returned an items array
          if ! jq -e '.items and (.items | type == "array")' topTracksShort.json > /dev/null; then
            echo "Spotify returned an unexpected response:"
            cat topTracksShort.json
            exit 1
          fi

          shortTrack_1=$(jq -r '.items[0].name // empty' topTracksShort.json)
          shortArtist_1=$(jq -r '.items[0].album.artists[0].name // empty' topTracksShort.json)
          shortImg_1=$(jq -r '.items[0].album.images[2].url // .items[0].album.images[0].url // empty' topTracksShort.json)

          shortTrack_2=$(jq -r '.items[1].name // empty' topTracksShort.json)
          shortArtist_2=$(jq -r '.items[1].album.artists[0].name // empty' topTracksShort.json)
          shortImg_2=$(jq -r '.items[1].album.images[2].url // .items[1].album.images[0].url // empty' topTracksShort.json)

          shortTrack_3=$(jq -r '.items[2].name // empty' topTracksShort.json)
          shortArtist_3=$(jq -r '.items[2].album.artists[0].name // empty' topTracksShort.json)
          shortImg_3=$(jq -r '.items[2].album.images[2].url // .items[2].album.images[0].url // empty' topTracksShort.json)

          shortTrack_4=$(jq -r '.items[3].name // empty' topTracksShort.json)
          shortArtist_4=$(jq -r '.items[3].album.artists[0].name // empty' topTracksShort.json)
          shortImg_4=$(jq -r '.items[3].album.images[2].url // .items[3].album.images[0].url // empty' topTracksShort.json)

          shortTrack_5=$(jq -r '.items[4].name // empty' topTracksShort.json)
          shortArtist_5=$(jq -r '.items[4].album.artists[0].name // empty' topTracksShort.json)
          shortImg_5=$(jq -r '.items[4].album.images[2].url // .items[4].album.images[0].url // empty' topTracksShort.json)

          {
            echo "shortTrack_1<<EOF"
            echo "$shortTrack_1"
            echo "EOF"

            echo "shortArtist_1<<EOF"
            echo "$shortArtist_1"
            echo "EOF"

            echo "shortImg_1=$shortImg_1"

            echo "shortTrack_2<<EOF"
            echo "$shortTrack_2"
            echo "EOF"

            echo "shortArtist_2<<EOF"
            echo "$shortArtist_2"
            echo "EOF"

            echo "shortImg_2=$shortImg_2"

            echo "shortTrack_3<<EOF"
            echo "$shortTrack_3"
            echo "EOF"

            echo "shortArtist_3<<EOF"
            echo "$shortArtist_3"
            echo "EOF"

            echo "shortImg_3=$shortImg_3"

            echo "shortTrack_4<<EOF"
            echo "$shortTrack_4"
            echo "EOF"

            echo "shortArtist_4<<EOF"
            echo "$shortArtist_4"
            echo "EOF"

            echo "shortImg_4=$shortImg_4"

            echo "shortTrack_5<<EOF"
            echo "$shortTrack_5"
            echo "EOF"

            echo "shortArtist_5<<EOF"
            echo "$shortArtist_5"
            echo "EOF"

            echo "shortImg_5=$shortImg_5"
          } >> "$GITHUB_ENV"

          echo "Short-term tracks retrieved successfully."


      # ------------------------------------------------------------
      # Get Top Tracks - Medium Term
      # ------------------------------------------------------------
      - name: Get Users Top Tracks (Medium)
        id: top_tracks_medium
        shell: bash
        run: |
          set -euo pipefail

          echo "Getting medium-term top tracks..."

          http_code=$(curl -sS \
